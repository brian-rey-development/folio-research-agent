[project]
name = "folio-ai"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "folio-core",
    "folio-sources",
    "folio-db",
    "pydantic-ai-slim[anthropic,openai,google]>=2.65.0",
    "anthropic>=2.4.0",
    "langfuse>=5.1.0",
    "genai-prices>=0.2.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
